<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loxford Park Tennis: shot trainer</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #14101f; color: #f3ecff;
               font: 16px -apple-system, system-ui, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 48px; }
  h1 { font-size: 15px; letter-spacing: .12em; color: #9d8fc4; margin: 0 0 4px; font-weight: 600; }
  #title { font: 800 40px ui-monospace, Menlo, monospace; color: #ffe27a; margin: 0 0 6px; }
  #how { font-size: 19px; margin: 0 0 14px; max-width: 640px; }
  #views { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 0; }
  @media (max-width: 820px) { #views { grid-template-columns: 1fr; } }
  figure { margin: 0; }
  figcaption { font: 600 14px system-ui; color: #9d8fc4; margin: 0 0 6px; }
  .stage { position: relative; overflow: hidden; background: #1d1730; border: 1px solid #3a2f5c; border-radius: 12px; }
  .stage > canvas:first-child { display: block; width: 100%; aspect-ratio: 16 / 9; }
  #ex, #play { image-rendering: pixelated; }
  #bat { position: absolute; right: 8px; top: 8px; width: 34%; aspect-ratio: 16 / 9; border: 1px solid #3a2f5c;
         border-radius: 8px; background: #1d1730; }
  #tags2 { position: absolute; left: 10px; bottom: 8px; font: 700 14px ui-monospace, Menlo, monospace; color: #fff;
           text-shadow: 0 2px 0 #000; white-space: pre; }
  #tags { position: absolute; left: 10px; bottom: 8px; font: 700 14px ui-monospace, Menlo, monospace; color: #fff;
          text-shadow: 0 2px 0 #000; white-space: pre; }
  #rec-badge { font: 800 12px ui-monospace, Menlo, monospace; padding: 2px 8px; border-radius: 10px; margin-left: 8px;
               background: #2c2347; color: #9d8fc4; }
  #rec-badge.on { background: #e0405e; color: #fff; }
  #mapping { background: #1d1730; border: 1px solid #3a2f5c; border-radius: 10px; padding: 10px 12px; margin: 12px 0 0;
             font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
  #mapping button { margin: 0; padding: 6px 12px; font-size: 14px; }
  #m-read { flex-basis: 100%; font: 14px ui-monospace, Menlo, monospace; color: #ffe27a; }
  #m-msg { color: #7be0a0; }
  #controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  #controls button { margin: 0; }
  #rec.on { background: #e0405e; color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  .keys { font-size: 13px; color: #9d8fc4; }
  #ask { font-size: 20px; font-weight: 700; margin: 18px 0 6px; }
  #dots { display: flex; gap: 8px; margin: 10px 0; }
  .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #5d4d8f; }
  .dot.done { background: #7be0a0; border-color: #7be0a0; }
  #last, #conn { font: 14px ui-monospace, Menlo, monospace; color: #cbbfe8; min-height: 20px; }
  #conn.bad { color: #ff9a9a; }
  kbd { background: #2c2347; border-radius: 4px; padding: 1px 6px; font: 13px ui-monospace, Menlo, monospace; }
  #bar { display: flex; gap: 6px; margin: 0 0 14px; flex-wrap: wrap; }
  .step { font: 12px ui-monospace, Menlo, monospace; padding: 3px 8px; border-radius: 10px; background: #2c2347; color: #9d8fc4; }
  .step.cur { background: #ffe27a; color: #14101f; }
  .step.done { background: #2f5d43; color: #d8ffe6; }
  table { border-collapse: collapse; width: 100%; font: 14px ui-monospace, Menlo, monospace; margin: 10px 0 18px; }
  td, th { border-bottom: 1px solid #3a2f5c; padding: 6px 8px; text-align: left; }
  button { font: 700 16px system-ui; padding: 10px 18px; border-radius: 8px; border: 0; background: #ffe27a;
           color: #14101f; cursor: pointer; margin-right: 8px; }
  button.alt { background: #2c2347; color: #f3ecff; }
  #result { display: none; }
  .ok { color: #7be0a0; } .no { color: #ff9a9a; }
</style>
</head>
<body>
<main>
  <h1>LOXFORD PARK TENNIS · SHOT TRAINER</h1>
  <div id="bar"></div>
  <div id="train">
    <div id="title"></div>
    <p id="how"></p>
    <div id="views">
      <figure>
        <figcaption>1. Watch: this return, in the game</figcaption>
        <div class="stage"><canvas id="ex" aria-label="Example return in the game"></canvas><div id="tags"></div></div>
      </figure>
      <figure>
        <figcaption>2. Your turn: return that ball with your phone <span id="rec-badge"></span></figcaption>
        <div class="stage"><canvas id="play" aria-label="Your return in the game"></canvas>
          <canvas id="bat" aria-label="Your phone movement"></canvas><div id="tags2"></div></div>
      </figure>
    </div>
    <div id="mapping">
      <b>Bat not moving like your hand?</b>
      <label><input type="checkbox" id="m-lr"> flip left/right</label>
      <label><input type="checkbox" id="m-ud"> flip up/down</label>
      <label>grip twist <select id="m-tw"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></label>
      <button id="m-save" class="alt">Save for the game</button>
      <span id="m-msg"></span>
      <div id="m-read"></div>
    </div>
    <div id="ask"></div>
    <div id="controls">
      <button id="rec">● Start recording</button>
      <button id="discard" class="alt">Discard last swing</button>
      <button id="replaySwing" class="alt">Replay my last swing</button>
      <button id="replayEx" class="alt">Replay example</button>
      <button id="prev" class="alt">‹ Previous shot</button>
      <button id="next" class="alt">Next shot ›</button>
      <button id="done" class="alt">Finish</button>
    </div>
    <div id="dots"></div>
    <div id="last"></div>
    <div id="conn"></div>
    <p class="keys"><kbd>Enter</kbd> start / stop recording &nbsp; <kbd>Backspace</kbd> discard last swing &nbsp; <kbd>Space</kbd> next shot &nbsp; <kbd>←</kbd> previous &nbsp; <kbd>E</kbd> replay example &nbsp; <kbd>P</kbd> replay my swing</p>
  </div>
  <div id="result">
    <div id="title2" style="font:800 28px ui-monospace,Menlo,monospace;color:#ffe27a;margin-bottom:8px"></div>
    <div id="summary"></div>
    <table id="table"></table>
    <button id="save">Save and use these in the game</button>
    <button id="again" class="alt">Start over</button>
    <p id="saved"></p>
  </div>
</main>
<script type="importmap">
    { "imports": { "three": "/vendor/three/build/three.module.js" } }
  </script>
<script type="module" src="/game/train.js"></script>
</body>
</html>
