<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loxford Park Tennis</title>
<style>
  /* Menu and overlay colours: deep navy */
  :root { --btn: #1d3f78; --btn-hi: #2f66c0; --btn-edge: #12294f; --bg: #0b1220; --bg2: #080e1a; --ink: 8,14,30; --card: 14,26,52; --wash: 24,52,110;
          --tx0: #eef3ff; --tx1: #e4ecfb; --tx1b: #cfdcf2; --tx2: #b4c6e6; --tx3: #8ea6cf; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas#view { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: cover; image-rendering: pixelated; }
  /* Two players: side by side on a wide window, stacked on a tall one. */
  body.two canvas#view, body.two canvas#view2 { position: fixed; inset: auto; width: 50vw; height: 100vh; top: 0; object-fit: cover; }
  body.two canvas#view { left: 0; }
  body.two canvas#view2 { right: 0; }
  body.two::after { content: ''; position: fixed; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: #14101f; }
  @media (max-aspect-ratio: 1/1) {
    body.two canvas#view, body.two canvas#view2 { width: 100vw; height: 50vh; left: 0; right: auto; }
    body.two canvas#view { top: 0; }
    body.two canvas#view2 { top: 50%; }
    body.two::after { left: 0; right: 0; top: 50%; bottom: auto; width: auto; height: 4px; margin: -2px 0 0; }
    #shotL { left: 0; right: 0; bottom: auto; top: 46%; width: auto; } #shotR { left: 0; right: 0; bottom: 14%; width: auto; }
  }
  #view2 { display: none; }
  body.two #view2 { display: block; }
  .shotHalf { position: fixed; bottom: 14%; width: 50vw; text-align: center; color: #ffe27a; font: 800 22px ui-monospace, Menlo, monospace; text-shadow: 0 2px 0 #000; pointer-events: none; }
  #shotL { left: 0; } #shotR { right: 0; }
  body:not(.two) .shotHalf { display: none; }
  #hud { position: fixed; left: 12px; top: 12px; max-width: 45vw; white-space: pre-wrap; color: var(--tx0); font: 600 14px ui-monospace, Menlo, monospace; line-height: 1.4;
         background: rgba(var(--ink),.72); border: 2px solid rgba(255,226,122,.45); border-radius: 8px; padding: 6px 12px 6px 10px;
         box-shadow: 0 4px 14px rgba(0,0,0,.4); pointer-events: none; }
  #hud:empty { display: none; }
  body.two #hud { max-width: calc(50vw - 120px); font-size: 12px; }
  body.ui-16bit #hud { border-radius: 0; border-width: 4px; border-left-color: #fcd34d; background: #0a0830; box-shadow: 6px 6px 0 #000; font-size: 11px; }
  #banner { z-index: 2; position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
            color: #fff; font: 700 28px -apple-system, system-ui, sans-serif; background: rgba(var(--ink),.6); white-space: pre; text-align: center; }
  /* match over: no darkening, the result sits above a Rematch button in the middle of the picture */
  body.matchend #banner { background: none; padding-bottom: 14vh; text-shadow: 0 2px 10px rgba(0,0,0,.85); }
  #rematch { display: none; position: fixed; z-index: 3; left: 50%; top: 56%; transform: translateX(-50%); padding: 14px 44px; font: 800 24px -apple-system, system-ui, sans-serif; letter-spacing: 1px;
             color: #1b1b1b; background: #ffd166; border: 0; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 0 #b88a1f, 0 8px 20px rgba(0,0,0,.45); }
  #rematch:hover { background: #ffe08a; } #rematch:active { transform: translateX(-50%) translateY(2px); box-shadow: 0 2px 0 #b88a1f, 0 4px 12px rgba(0,0,0,.45); }
  body.matchend #rematch { display: block; }
  #shot { position: fixed; left: 0; right: 0; bottom: 14%; text-align: center; color: #ffe27a;
          font: 800 34px ui-monospace, Menlo, monospace; text-shadow: 0 2px 0 #000; pointer-events: none; }
  #score { position: fixed; right: var(--sb-right, 12px); top: var(--sb-top, 12px); min-width: 168px; background: rgba(var(--ink),.78); border: 2px solid rgba(255,255,255,.18);
           border-radius: 10px; overflow: hidden; color: #fff; font: 800 18px ui-monospace, Menlo, monospace; box-shadow: 0 4px 14px rgba(0,0,0,.45); pointer-events: none; }
  #score:empty { display: none; }
  .sbrow { display: grid; grid-template-columns: 14px 1fr 34px 54px; align-items: center; gap: 6px; padding: 6px 10px; }
  .sbrow + .sbrow { border-top: 1px solid rgba(255,255,255,.14); }
  .sbname { letter-spacing: 1px; }
  .sbdot { width: 9px; height: 9px; border-radius: 50%; background: transparent; }
  .sbrow.srv .sbdot { background: #ffe27a; box-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .sbgames { text-align: center; background: rgba(255,255,255,.14); border-radius: 5px; padding: 1px 0; }
  .sbpts { text-align: right; color: #ffe27a; font-size: 22px; }
  body.two #score { right: auto; left: 50%; top: 10px; transform: translateX(-50%); z-index: 1; background: var(--bg2); }
  @media (max-aspect-ratio: 1/1) { body.two #score { top: 50%; transform: translate(-50%, -50%); } }
  body.ui-16bit #score { border-radius: 0; border: 4px solid #fff; background: #0a0830; box-shadow: 6px 6px 0 #000; font-size: 12px; font-weight: 400; }
  body.ui-16bit .sbgames { border-radius: 0; }
  body.ui-16bit .sbpts { font-size: 14px; color: #fcd34d; }
  /* Menus: title, cat and court pick, settings */
  #menu { z-index: 2; position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 18px;
          background: radial-gradient(90% 70% at 50% 30%, rgba(var(--wash),.82), rgba(var(--ink),.93)); color: #fff;
          font: 700 22px ui-monospace, Menlo, monospace; text-align: center; overflow: auto; animation: fadein .3s ease-out; }
  /* the blur sits on a pseudo-element: a backdrop-filter on #menu itself would make its fixed footer hint scroll with the page instead of staying at the bottom */
  #menu::before { content: ''; position: fixed; inset: 0; z-index: -1; backdrop-filter: blur(3px); pointer-events: none; }
  #menu h2 { margin: 0; font-size: clamp(22px, 4vw, 34px); color: #ffd166; text-shadow: 0 3px 0 #b8641c; }
  #menu .steps { font-size: 15px; letter-spacing: 2px; text-transform: uppercase; color: var(--tx3); margin-top: -8px; }
  #menu .foot { position: fixed; left: 0; right: 0; bottom: 0; font-size: 16px; font-weight: 500; color: var(--tx1); padding: 28px 16px 14px; background: linear-gradient(rgba(var(--ink),0), rgba(var(--ink),.97) 55%); pointer-events: none; } /* (nearly solid under the text, so a long page scrolling behind it does not strike through the hint) */
  #menu { padding-bottom: 84px; justify-content: safe center; } /* room for the fixed footer hint, so tall screens scroll above it */
  .sethelp { margin: 4px 0 0; min-height: 2.6em; max-width: 46ch; font-size: 15px; font-weight: 500; line-height: 1.4; color: var(--tx1b); text-wrap: balance; }
  #menu :focus-visible, #pause :focus-visible { outline: 3px solid #ffd166; outline-offset: 3px; }
  body.menu-open #hud, body.menu-open #score, body.menu-open #shot, body.menu-open #tut { display: none !important; } /* the match overlays stay out of the menu's way */
  .logo { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-bottom: 10px; animation: bob 3s ease-in-out infinite; }
  .logo .mark.pixel { width: clamp(110px, 19vw, 170px); image-rendering: pixelated; filter: drop-shadow(0 4px 0 rgba(0,0,0,.45)); }
  .logo .mark { width: clamp(84px, 15vw, 140px); height: auto; filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)); }
  .logo .l1 { font-weight: 900; font-size: clamp(32px, 8vw, 76px); letter-spacing: 4px; color: #ffd166; text-shadow: 0 6px 0 #b8641c, 0 10px 18px rgba(0,0,0,.5); line-height: 1; }
  .logo .l2 { display: flex; align-items: center; gap: 14px; font-weight: 900; font-size: clamp(20px, 5vw, 44px); letter-spacing: 14px; color: #fff; text-shadow: 0 4px 0 var(--btn-hi); }
  .logo .l2 i { display: block; width: clamp(24px, 8vw, 90px); height: 4px; border-radius: 2px; background: linear-gradient(90deg, transparent, #d8ff3a); }
  .logo .l2 i:last-child { transform: scaleX(-1); }
  .buttons { display: flex; flex-direction: column; gap: 12px; width: min(86vw, 380px); }
  .mbtn { font: inherit; font-size: clamp(18px, 3.4vw, 26px); color: #fff; background: var(--btn); border: 3px solid transparent; border-radius: 16px; padding: 14px 20px; cursor: pointer;
          box-shadow: 0 5px 0 var(--btn-edge); transition: transform .12s, background .15s, border-color .15s; }
  .mbtn.sel, .mbtn:hover { background: var(--btn-hi); border-color: #ffd166; transform: translateY(-2px) scale(1.03); }
  .mbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--btn-edge); }
  .grid { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 14px; width: min(92vw, 720px); }
  .grid.courts { --cols: 4; width: min(96vw, 1000px); }
  .grid.courts .venue { display: block; font-size: 0.7em; opacity: 0.7; margin-top: 2px; }
  .card { font: inherit; color: #fff; background: rgba(var(--card),.92); border: 3px solid rgba(255,255,255,.12); border-radius: 18px; padding: 12px 10px 10px; cursor: pointer;
          display: flex; flex-direction: column; align-items: center; gap: 4px; transition: transform .14s, border-color .15s, box-shadow .2s; }
  .card svg { width: 100%; max-width: 150px; height: auto; }
  .card.wide svg { max-width: 260px; border-radius: 10px; }
  .card b { font-size: 17px; }
  .card small { font-size: 12px; font-weight: 400; color: var(--tx2); }
  .card.sel, .card:hover { border-color: #ffd166; transform: translateY(-4px) scale(1.04); box-shadow: 0 0 0 4px rgba(255,209,102,.25), 0 14px 24px rgba(0,0,0,.4); }
  .times { display: flex; gap: 8px; }
  .timebtn { font: inherit; font-size: 15px; color: #fff; background: rgba(var(--card),.92); border: 3px solid rgba(255,255,255,.15); border-radius: 12px; padding: 6px 18px; cursor: pointer; }
  .timebtn.on { border-color: #ffd166; background: var(--btn-hi); }
  .blurb { margin: 0; font-size: 15px; font-weight: 400; color: var(--tx2); min-height: 1.4em; }
  /* settings: the four groups as wide cards with what they are set to, and rows with every choice on show */
  .slist { display: flex; flex-direction: column; gap: 10px; width: min(92vw, 520px); }
  .scard { display: flex; align-items: center; gap: 16px; text-align: left; padding: 14px 18px; }
  .scard .ticon { width: 40px; height: 40px; flex: none; color: #ffd166; } .scard.sel .ticon { color: #fff; }
  .scard .mtxt { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .scard small { font-size: clamp(11px, 1.9vw, 14px); font-weight: 500; color: var(--tx2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scard .chev { font-style: normal; font-size: 30px; color: var(--tx3); }
  .srow2 { display: flex; gap: 12px; width: min(92vw, 520px); } .srow2 .mbtn { flex: 1; font-size: clamp(14px, 2.4vw, 18px); padding: 10px 12px; }
  .seg { display: inline-flex; gap: 4px; background: rgba(0,0,0,.28); padding: 3px; border-radius: 12px; }
  .seg button, .row .val .seg button { width: auto; height: auto; min-width: 4.2em; padding: 6px 12px; border-radius: 9px; background: transparent; color: var(--tx1); font-size: 15px; }
  .seg button.on, .row .val .seg button.on { background: #ffd166; color: #2a1a00; font-weight: 700; }
  .notches { display: inline-flex; align-items: flex-end; gap: 3px; height: 26px; }
  .notches i { display: block; width: 9px; height: 100%; border-radius: 3px; background: rgba(255,255,255,.16); cursor: pointer; }
  .notches i:nth-child(n) { height: calc(35% + var(--k, 0) * 6.5%); }
  .notches i.on { background: #ffd166; }
  .row .val .nval { min-width: 3.4em; text-align: right; color: #ffd166; font-variant-numeric: tabular-nums; }
  .rows { display: flex; flex-direction: column; gap: 8px; width: min(92vw, 520px); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-radius: 14px; background: rgba(var(--card),.92); border: 3px solid transparent; font-size: 18px; cursor: pointer; }
  .row.sel, .row:hover { border-color: #ffd166; }
  .row .val { display: flex; align-items: center; gap: 10px; }
  .row .val b { min-width: 11ch; text-align: center; color: #ffd166; }
  .row .val button { font: inherit; color: #fff; background: var(--btn); border: 0; border-radius: 10px; width: 42px; height: 42px; cursor: pointer; }
  .row .val button:hover { background: var(--btn-hi); }
  .mbtn.back { margin-top: 8px; }



  /* ---- Title: three ways to play, the story as a banner, then the rest ---- */
  .tgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; width: min(94vw, 640px); }
  .tcard { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; grid-column: span 2; padding: 14px 8px 12px; font-size: clamp(15px, 2.6vw, 21px); }
  .tcard .ticon { width: clamp(30px, 6vw, 44px); height: clamp(30px, 6vw, 44px); color: #ffd166; }
  .tcard small { font-size: clamp(10px, 1.6vw, 12px); font-weight: 500; color: var(--tx2); letter-spacing: 0; text-transform: none; line-height: 1.25; }
  .tcard.t-story { grid-column: 1 / -1; flex-direction: row; gap: 16px; padding: 14px 22px; background: linear-gradient(100deg, #3a2a7a, var(--btn-hi) 60%, #2f6e9a); border-color: rgba(255,209,102,.55); text-align: left; justify-content: flex-start; }
  .tcard.t-story span { font-size: clamp(20px, 3.8vw, 30px); } .tcard.t-story .ticon { flex: none; width: clamp(40px, 7vw, 56px); height: clamp(40px, 7vw, 56px); }
  .tcard.t-story small { display: block; margin-top: 2px; }
  .tcard.t-story > span, .tcard.t-story > small { grid-area: auto; }
  .tcard.t-modes, .tcard.t-tutorial, .tcard.t-settings { padding: 10px 6px 9px; font-size: clamp(13px, 2.2vw, 17px); } .tcard.t-modes .ticon, .tcard.t-tutorial .ticon, .tcard.t-settings .ticon { width: 28px; height: 28px; }
  .tcard.sel .ticon, .tcard:hover .ticon { color: #fff; }
  @media (max-width: 420px) { .tcard small { display: none; } .tcard.t-story small { display: block; } }


  /* ---- More modes: a daily banner, two big cards, two keepsake cards and a small back pill ---- */
  .mgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; width: min(94vw, 600px); }
  .mcard { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; grid-column: span 3; padding: 18px 10px 16px; text-align: center; font-size: clamp(16px, 2.8vw, 22px); }
  .mcard .ticon { width: clamp(40px, 8vw, 58px); height: clamp(40px, 8vw, 58px); color: #ffd166; transition: transform .2s cubic-bezier(.2,1.5,.4,1); }
  .mcard .mtxt { display: flex; flex-direction: column; align-items: inherit; gap: 2px; }
  .mcard.m-daily .mtxt, .mcard.m-practice .mtxt, .mcard.m-wardrobe .mtxt, .mcard.m-career .mtxt { align-items: flex-start; }
  .mcard.m-back .mtxt { align-items: center; }
  .mcard small { font-size: clamp(10px, 1.7vw, 13px); font-weight: 500; color: var(--tx2); letter-spacing: 0; text-transform: none; line-height: 1.25; }
  .mcard.sel .ticon, .mcard:hover .ticon { color: #fff; transform: scale(1.18) rotate(-6deg); }
  .mcard.m-daily { grid-column: 1 / -1; flex-direction: row; justify-content: flex-start; gap: 16px; text-align: left; padding: 16px 22px; background: linear-gradient(100deg, #7a4a12, #b9792a 55%, #d99a3a); border-color: rgba(255,209,102,.6); }
  .mcard.m-daily .ticon { flex: none; color: #fff3c4; } .mcard.m-daily span { display: block; font-size: clamp(20px, 3.8vw, 30px); } .mcard.m-daily small { display: block; margin-top: 2px; color: #ffeec2; }
  .mcard.m-tourney, .mcard.m-party { padding: 24px 10px 22px; min-height: 148px; }
  .mcard.m-tourney { background: linear-gradient(160deg, #2a2a78, #3a2a7a 60%, #23506f); }
  .mcard.m-party { background: linear-gradient(160deg, #6a1f6a, #3a2a7a 55%, #1f5f7a); }
  .mcard.m-doubles { grid-column: 1 / -1; flex-direction: row; justify-content: flex-start; gap: 16px; text-align: left; padding: 14px 22px; background: linear-gradient(100deg, #1d4a3a, #2a6a4e 55%, #3b8a62); }
  .mcard.m-doubles .mtxt { align-items: flex-start; } .mcard.m-doubles .ticon { flex: none; color: #d7ffe6; } .mcard.m-doubles span { display: block; } .mcard.m-doubles small { display: block; color: #d7ffe6; }
  .mcard.m-tourney .ticon, .mcard.m-party .ticon { width: clamp(52px, 10vw, 72px); height: clamp(52px, 10vw, 72px); }
  .mcard.m-practice, .mcard.m-wardrobe, .mcard.m-career { flex-direction: row; justify-content: flex-start; text-align: left; gap: 12px; padding: 12px 14px; font-size: clamp(14px, 2.4vw, 18px); }
  .mcard.m-practice .ticon, .mcard.m-wardrobe .ticon, .mcard.m-career .ticon { flex: none; width: 34px; height: 34px; } .mcard.m-practice span, .mcard.m-wardrobe span, .mcard.m-career span { display: block; } .mcard.m-practice small, .mcard.m-wardrobe small, .mcard.m-career small { display: block; }
  .mcard.m-back { grid-column: 3 / span 2; flex-direction: row; gap: 6px; padding: 8px 12px; border-radius: 99px; font-size: clamp(13px, 2.2vw, 16px); }
  .mcard.m-back .ticon { width: 20px; height: 20px; }
  @media (max-width: 420px) { .mcard.m-practice, .mcard.m-wardrobe, .mcard.m-career { flex-direction: column; text-align: center; } .mcard.m-tourney, .mcard.m-party { min-height: 120px; } }

  /* Title entrance: the logo drops in, then the cards rise one after another (plays once when the title appears) */
  /* the title page's backdrop: the cats chase each other round the court (a 3D scene behind the menu) */
  #titlescene { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: cover; image-rendering: pixelated; display: none; z-index: 1; }
  #menu.title { background: radial-gradient(75% 60% at 50% 42%, rgba(var(--ink),.74), rgba(var(--ink),.3)); }
  #menu.title::before { backdrop-filter: none; }
  /* the "made by" stamp on the title page: an ink-stamp look, tilted, in the bottom-right corner above the key hints */
  .stamp { position: fixed; right: clamp(14px, 4vw, 56px); bottom: clamp(56px, 11vh, 110px); transform: rotate(-9deg); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 16px 8px; border: 3px double #ff7a59; border-radius: 8px; color: #ff7a59; text-transform: uppercase; text-align: center; opacity: .88; pointer-events: none; user-select: none; background: rgba(20, 8, 6, .28); text-shadow: 0 1px 0 rgba(0,0,0,.35); z-index: 2; }
  .stamp span { font-size: clamp(9px, 1.3vw, 12px); letter-spacing: 4px; font-weight: 700; }
  .stamp b { font-size: clamp(14px, 2.2vw, 22px); letter-spacing: 3px; font-weight: 900; }
  @media (max-aspect-ratio: 1/1) { .stamp { bottom: clamp(70px, 12vh, 120px); right: 10px; } }
  .tfirst { display: contents; }
  .tfirst.enter .logo { animation: logodrop .75s cubic-bezier(.2,1.5,.4,1) both, bob 3s ease-in-out .75s infinite; }
  .tfirst.enter .tcard { animation: cardrise .5s cubic-bezier(.2,.9,.3,1.2) both; animation-delay: calc(var(--n) * 70ms + 380ms); }
  .tfirst.enter .sethelp { animation: fadein .6s ease-out 1.1s both; }
  @keyframes logodrop { from { transform: translateY(-60px) scale(.7) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes cardrise { from { transform: translateY(26px) scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .tfirst.enter .logo, .tfirst.enter .tcard, .tfirst.enter .sethelp { animation: none; } }


  /* Screen to screen: the new screen slides in from the side you are heading to */
  .sw-fwd { animation: swfwd .34s cubic-bezier(.2,.9,.3,1) both; } .sw-back { animation: swback .34s cubic-bezier(.2,.9,.3,1) both; }
  @keyframes swfwd { from { transform: translateX(46px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes swback { from { transform: translateX(-46px); opacity: 0; } to { transform: none; opacity: 1; } }


  /* Menu to match: a quick fade up from dark */
  #fade { position: fixed; inset: 0; z-index: 9; background: #05080f; opacity: 0; pointer-events: none; }
  #fade.go { animation: fadeup .5s ease-out both; }
  @keyframes fadeup { from { opacity: 1; } to { opacity: 0; } }

  /* Online lobby: waiting for the friend, the link to send, and the phone QR */
  #lobby { z-index: 8; position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 18px; text-align: center; color: #fff;
           background: radial-gradient(90% 70% at 50% 30%, rgba(var(--wash),.9), rgba(var(--ink),.96)); font: 700 20px ui-monospace, Menlo, monospace; overflow: auto; }
  #lobby h2 { margin: 0; font-size: clamp(22px, 4vw, 34px); color: #ffd166; text-shadow: 0 3px 0 #b8641c; }
  #lobby .code { font-size: clamp(44px, 10vw, 88px); letter-spacing: 12px; color: #fff; text-shadow: 0 5px 0 var(--btn-hi); padding-left: 12px; }
  #lobby .link { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; max-width: min(92vw, 640px); }
  #lobby .link input { font: 600 15px ui-monospace, Menlo, monospace; width: min(70vw, 440px); padding: 10px 12px; border-radius: 10px; border: 2px solid rgba(255,255,255,.25); background: rgba(var(--card),.92); color: #fff; }
